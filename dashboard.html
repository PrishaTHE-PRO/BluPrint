<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BluPrint | Room Planning Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <!-- Rough.js: hand-drawn "ink pen" room previews on the project cards (see dashboard.js). -->
    <script src="https://unpkg.com/roughjs@4.6.6/bundled/rough.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --garden-dark: #0A3323;
            --garden-moss: #839958;
            --garden-beige: #F7F4D5;
            --garden-rosy: #D3968C;
            --garden-midnight: #105666;
            --nav-pink: #f5a7b8;
        }
        body { font-family: 'Quicksand', sans-serif; background-color: var(--garden-dark); color: var(--garden-beige); margin: 0; padding: 0; }
        h1, h2, h3, h4 { font-family: 'Crimson Pro', serif; }
        .grid-background {
            background-image:
                    linear-gradient(rgba(131,153,88,0.07) 1.5px, transparent 1.5px),
                    linear-gradient(90deg, rgba(131,153,88,0.07) 1.5px, transparent 1.5px);
            background-size: 50px 50px;
        }
        .noise-texture { position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0.03; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
        .ghibli-border { border: 2px solid rgba(247,244,213,0.15); border-radius: 40px 60px 45px 70px / 65px 45px 75px 45px; }
        .garden-card { background: rgba(16,86,102,0.2); backdrop-filter: blur(12px); transition: all 0.5s cubic-bezier(0.23,1,0.32,1); border: 1px solid rgba(247,244,213,0.05); }
        .garden-card:hover { transform: translateY(-8px) scale(1.02); background: rgba(16,86,102,0.3); border-color: rgba(211,150,140,0.4); box-shadow: 0 30px 60px -15px rgba(0,0,0,0.4); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-20px) rotate(2deg); } }
        @keyframes sparkle-pulse { 0%,100% { opacity: 0.2; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.3); } }
        .animate-reveal { animation: fadeInUp 0.8s cubic-bezier(0.22,1,0.36,1) forwards; opacity: 0; }
        .floating-avatar { animation: float 6s ease-in-out infinite; }
        .sparkle-icon { animation: sparkle-pulse 4s ease-in-out infinite; }
        .nav-link::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 2px; background: var(--garden-dark); transition: width 0.3s ease; }
        .nav-link:hover::after { width: 100%; }
        /* toast */
        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(10,51,35,0.95); border: 1px solid rgba(247,244,213,0.15); color: var(--garden-beige); font-family: 'Quicksand', sans-serif; font-size: 14px; padding: 12px 28px; border-radius: 999px; opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none; z-index: 100; backdrop-filter: blur(8px); }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        ::-webkit-scrollbar { width: 8px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--garden-moss); border-radius: 10px; }
    </style>
    <link rel="stylesheet" href="./design-system.css">
</head>
<body class="page-dashboard">
<div class="min-h-screen flex flex-col relative grid-background">
    <div class="noise-texture"></div>

    <nav class="app-nav sticky top-0 z-50">
        <a href="dashboard.html" class="app-brand">
            <div class="w-12 h-12 bg-[#0A3323] rounded-[1.2rem] flex items-center justify-center">
                <iconify-icon icon="ph:sparkle-duotone" class="text-3xl text-[#F7F4D5]"></iconify-icon>
            </div>
            <span class="text-3xl font-bold tracking-tighter text-[#0A3323]" style="font-family:'Crimson Pro',serif;">BluPrint</span>
        </a>
        <div class="app-nav-links">
            <a href="dashboard.html" class="active"><iconify-icon icon="ph:house-duotone"></iconify-icon>Home</a>
            <a href="past-inspiration.html"><iconify-icon icon="ph:squares-four-duotone"></iconify-icon>Projects</a>
        </div>
        <div class="app-nav-actions">
            <button type="button" title="Notifications" aria-label="Notifications">
                <iconify-icon icon="ph:bell-duotone"></iconify-icon>
            </button>
            <div class="profile-menu-wrap">
                <button id="profile-btn" type="button" class="w-12 h-12 rounded-full bg-[#0A3323]/10 flex items-center justify-center cursor-pointer border-2 border-[#0A3323]/20 hover:bg-[#0A3323]/20 transition-all shadow-sm">
                    <iconify-icon icon="ph:user-circle-duotone" class="text-2xl text-[#0A3323]"></iconify-icon>
                </button>
                <div id="profile-popup" class="profile-popup hidden">
                    <a href="settings.html" class="profile-popup-item">
                        <iconify-icon icon="ph:gear-duotone"></iconify-icon> Settings
                    </a>
                    <button id="logout-btn" class="profile-popup-item profile-popup-item-danger">
                        <iconify-icon icon="ph:sign-out-duotone"></iconify-icon> Sign out
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <header class="dashboard-hero">
        <div class="dashboard-container dashboard-hero-layout animate-reveal">
            <div class="dashboard-character-wrap" aria-hidden="true">
                <img
                    class="dashboard-character floating-avatar"
                    src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/uploads/c8b9b493-90d2-48dc-beb9-1c448e14e0d2/1779936396285-b0204285/blueprintavatar.png"
                    alt=""
                    style="object-view-box: xywh(23.55% 14.37% 31.43% 47.54%);"
                >
            </div>
            <div class="dashboard-welcome-copy">
                <p class="dashboard-eyebrow">Welcome back</p>
                <h1><span id="user-name" aria-live="polite"></span></h1>
                <a href="room-dimensions.html" class="dashboard-new-room">
                    <iconify-icon icon="ph:plus-bold"></iconify-icon>
                    New Room
                </a>
            </div>
        </div>
    </header>

    <main class="dashboard-container dashboard-main">
        <section class="dashboard-projects animate-reveal">
            <div class="dashboard-section-heading">
                <h2>Recent rooms</h2>
                <a href="past-inspiration.html">
                    View all <iconify-icon icon="ph:caret-right-bold"></iconify-icon>
                </a>
            </div>
            <div id="projects-grid" aria-live="polite" aria-busy="true">
                <div class="project-card-skeleton"></div>
                <div class="project-card-skeleton"></div>
                <div class="project-card-skeleton"></div>
                <div class="project-card-skeleton"></div>
            </div>
        </section>
    </main>
</div>

<div id="toast"></div>

<script type="module" src="./dashboard.js"></script>
</body>
</html>
