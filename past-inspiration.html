<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BluPrint | Projects</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --garden-dark: #0A3323;
            --garden-moss: #839958;
            --garden-beige: #F7F4D5;
            --garden-rosy: #D3968C;
            --garden-midnight: #105666;
            --nav-pink: #f5a7b8;
        }
        body { font-family: 'Quicksand', sans-serif; background-color: var(--garden-dark); color: var(--garden-beige); margin: 0; padding: 0; }
        h1, h2, h3, h4 { font-family: 'Crimson Pro', serif; }
        .grid-background {
            background-image:
                    linear-gradient(rgba(131,153,88,0.07) 1.5px, transparent 1.5px),
                    linear-gradient(90deg, rgba(131,153,88,0.07) 1.5px, transparent 1.5px);
            background-size: 50px 50px;
        }
        .noise-texture { position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0.03; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
        .ghibli-border { border: 2px solid rgba(247,244,213,0.15); border-radius: 40px 60px 45px 70px / 65px 45px 75px 45px; }
        .garden-card { background: rgba(16,86,102,0.2); backdrop-filter: blur(12px); transition: all 0.5s cubic-bezier(0.23,1,0.32,1); border: 1px solid rgba(247,244,213,0.05); }
        .garden-card:hover { transform: translateY(-8px) scale(1.02); background: rgba(16,86,102,0.3); border-color: rgba(211,150,140,0.4); box-shadow: 0 30px 60px -15px rgba(0,0,0,0.4); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .animate-reveal { animation: fadeInUp 0.8s cubic-bezier(0.22,1,0.36,1) forwards; opacity: 0; }
        .nav-link::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 2px; background: var(--garden-dark); transition: width 0.3s ease; }
        .nav-link:hover::after { width: 100%; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--garden-dark); }
        ::-webkit-scrollbar-thumb { background: var(--garden-moss); border-radius: 10px; }
    </style>
    <link rel="stylesheet" href="./design-system.css">
</head>
<body class="page-projects">
<div class="min-h-screen flex flex-col relative grid-background">
    <div class="noise-texture"></div>

    <nav class="app-nav sticky top-0 z-50">
        <a href="dashboard.html" class="app-brand">
            <div class="w-12 h-12 bg-[#0A3323] rounded-[1.2rem] flex items-center justify-center">
                <iconify-icon icon="ph:sparkle-duotone" class="text-3xl text-[#F7F4D5]"></iconify-icon>
            </div>
            <span>BluPrint</span>
        </a>
        <div class="app-nav-links">
            <a href="dashboard.html"><iconify-icon icon="ph:house-duotone"></iconify-icon>Home</a>
            <a href="past-inspiration.html" class="active"><iconify-icon icon="ph:squares-four-duotone"></iconify-icon>Projects</a>
        </div>
        <div class="app-nav-actions">
            <button type="button" title="Notifications" aria-label="Notifications">
                <iconify-icon icon="ph:bell-duotone"></iconify-icon>
            </button>
            <button id="logout-btn" title="Sign out" class="w-12 h-12 rounded-full bg-[#0A3323]/10 flex items-center justify-center cursor-pointer border-2 border-[#0A3323]/20 hover:bg-[#0A3323]/20 transition-all shadow-sm">
                <iconify-icon icon="ph:sign-out-duotone" class="text-2xl text-[#0A3323]"></iconify-icon>
            </button>
        </div>
    </nav>

    <header class="projects-header animate-reveal">
        <div class="dashboard-container projects-header-row">
            <div>
                <h1>Past Projects</h1>
                <p id="project-count">Loading your rooms…</p>
            </div>
            <a href="room-dimensions.html" class="dashboard-new-room">
                <iconify-icon icon="ph:plus-bold"></iconify-icon>
                New Room
            </a>
        </div>
    </header>

    <main class="dashboard-container projects-main">
        <div id="project-filters" class="project-filters flex flex-wrap gap-2 mb-8" aria-label="Filter projects by style"></div>
        <div id="all-projects-grid" aria-live="polite" aria-busy="true">
            <div class="project-card-skeleton"></div>
            <div class="project-card-skeleton"></div>
            <div class="project-card-skeleton"></div>
        </div>
    </main>
</div>

<script type="module">
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { auth, isFirebaseConfigured } from "./firebase.js";

    const logoutBtn = document.getElementById('logout-btn');
    const grid = document.getElementById('all-projects-grid');
    const filters = document.getElementById('project-filters');
    const projectCount = document.getElementById('project-count');

    document.querySelectorAll('a[href="room-dimensions.html"]').forEach(link => {
        link.addEventListener('click', () => {
            [
                'blueprintCurrentRoomId', 'blueprintCurrentRoomName',
                'blueprintCurrentRoomWidth', 'blueprintCurrentRoomLength',
                'blueprintCurrentRoomHeight', 'blueprintStyleResult',
                'blueprintRoomLayout', 'blueprintCurrentRoomType',
            ].forEach(key => localStorage.removeItem(key));
        });
    });

    if (!isFirebaseConfigured() || !auth) {
        window.location.href = 'index.html';
    } else onAuthStateChanged(auth, function(user) {
        if (!user) { window.location.href = 'index.html'; return; }
        loadAllProjects(user.uid);
    });

    async function loadAllProjects(userId) {
        try {
            const res = await fetch('/api/rooms?userId=' + encodeURIComponent(userId));
            if (!res.ok) throw new Error();
            const rooms = await res.json();

            // Compatibility fallback for servers that return rooms without embedded styles.
            if (rooms.some(room => !Object.prototype.hasOwnProperty.call(room, 'style'))) {
                await Promise.all(rooms.map(async room => {
                    try {
                        const styleRes = await fetch('/api/rooms/' + room._id + '/style');
                        const styles = styleRes.ok ? await styleRes.json() : [];
                        room.style = styles.find(style => style.source === 'user') || null;
                    } catch {
                        room.style = null;
                    }
                }));
            }

            projectCount.textContent = `${rooms.length} room${rooms.length === 1 ? '' : 's'} designed`;

            if (!rooms.length) {
                filters.innerHTML = '';
                grid.innerHTML = '<p class="text-[#F7F4D5]/40 text-center col-span-3 py-12">No projects yet — create your first room.</p>';
                grid.setAttribute('aria-busy', 'false');
                return;
            }

            // The projects page contains every room, newest first.
            rooms.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            const styleNames = [...new Set(rooms.map(room => room.style?.styleTag).filter(Boolean))];
            let activeFilter = 'All';

            function renderFilters() {
                filters.innerHTML = '';
                ['All', ...styleNames].forEach(styleName => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'project-filter' + (styleName === activeFilter ? ' active' : '');
                    button.textContent = styleName;
                    button.addEventListener('click', () => {
                        activeFilter = styleName;
                        renderFilters();
                        renderProjects();
                    });
                    filters.appendChild(button);
                });
            }

            function renderProjects() {
                const visibleRooms = activeFilter === 'All'
                    ? rooms
                    : rooms.filter(room => room.style?.styleTag === activeFilter);

                grid.innerHTML = '';
                const cards = document.createDocumentFragment();
                visibleRooms.forEach((room, index) => {
                const hasStyle = !!room.style;
                const statusLabel = hasStyle ? 'Style Analyzed ✨' : 'Dimensions Set';
                const statusColor = hasStyle ? 'text-[#839958] font-bold' : 'text-[#F7F4D5]/40';
                const tag = room.style?.styleTag || '';
                const date = new Date(room.createdAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                const card = document.createElement('div');
                card.className = 'garden-card ghibli-border p-6 group cursor-pointer project-card-enter';
                card.style.setProperty('--card-delay', `${Math.min(index * 55, 330)}ms`);
                card.innerHTML = `
                    <div class="relative aspect-[16/10] rounded-[2.5rem] overflow-hidden mb-8 shadow-inner bg-[#105666]/30 flex items-center justify-center">
                        <iconify-icon icon="ph:floor-plan-duotone" class="text-7xl text-[#D3968C]/40"></iconify-icon>
                        <button class="delete-btn absolute top-5 left-5 w-9 h-9 rounded-full bg-[#0A3323]/70 hover:bg-[#D3968C] text-[#F7F4D5] flex items-center justify-center transition-all backdrop-blur z-10" title="Delete room">
                            <iconify-icon icon="ph:x-bold" class="text-lg"></iconify-icon>
                        </button>
                        <div class="absolute top-5 right-5">
                            <span class="bg-white/90 backdrop-blur px-4 py-2 rounded-full text-[#0A3323] text-sm font-bold shadow-lg">${hasStyle ? 'Complete' : 'In Progress'}</span>
                        </div>
                    </div>
                    <div class="px-2 space-y-2">
                        <h3 class="text-3xl font-bold text-[#F7F4D5]">${room.name}</h3>
                        <p class="text-lg text-[#F7F4D5]/60">${room.sqft} sq ft${tag ? ' · ' + tag : ''}</p>
                        <div class="pt-6 flex items-center justify-between border-t border-[#F7F4D5]/10 mt-6">
                            <span class="text-sm ${statusColor}">${statusLabel}</span>
                            <span class="text-xs text-[#F7F4D5]/30">${date}</span>
                        </div>
                    </div>`;
                cards.appendChild(card);

                // Click to revisit
                card.addEventListener('click', (e) => {
                    if (e.target.closest('.delete-btn')) return;
                    localStorage.setItem('blueprintCurrentRoomId',     room._id);
                    localStorage.setItem('blueprintCurrentRoomName',   room.name);
                    localStorage.setItem('blueprintCurrentRoomWidth',  String(room.widthFt));
                    localStorage.setItem('blueprintCurrentRoomLength', String(room.lengthFt));
                    localStorage.setItem('blueprintCurrentRoomHeight', String(room.heightFt || 8));
                    if (room.style) {
                        localStorage.setItem('blueprintCurrentRoomType', room.style.roomType ?? '');
                        localStorage.setItem('blueprintStyleResult', JSON.stringify({
                            roomType:     room.style.roomType     ?? '',
                            styleTag:     room.style.styleTag     ?? '',
                            moodTags:     room.style.moodTags     ?? [],
                            colorPalette: room.style.colorPalette ?? [],
                            roomFeatures: room.style.roomFeatures ?? [],
                            confidence:   room.style.confidence   ?? 0,
                        }));
                        window.location.href = 'room-result.html';
                    } else {
                        window.location.href = 'inspo-upload.html';
                    }
                });
                const deleteBtn = card.querySelector('.delete-btn');
                deleteBtn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    if (deleteBtn.dataset.confirming) {
                        deleteBtn.disabled = true;
                        try {
                            const res = await fetch('/api/rooms/' + room._id, { method: 'DELETE' });
                            if (res.ok) {
                                card.style.transition = 'opacity 0.3s';
                                card.style.opacity = '0';
                                const roomIndex = rooms.findIndex((item) => item._id === room._id);
                                if (roomIndex !== -1) rooms.splice(roomIndex, 1);
                                projectCount.textContent = `${rooms.length} room${rooms.length === 1 ? '' : 's'} designed`;
                                setTimeout(renderProjects, 300);
                            } else {
                                alert('Delete failed (' + res.status + ')');
                                deleteBtn.disabled = false;
                                deleteBtn.innerHTML = '<iconify-icon icon="ph:x-bold" class="text-lg"></iconify-icon>';
                            }
                        } catch (err) {
                            alert('Delete failed: ' + err.message);
                            deleteBtn.disabled = false;
                            deleteBtn.innerHTML = '<iconify-icon icon="ph:x-bold" class="text-lg"></iconify-icon>';
                        }
                    } else {
                        deleteBtn.dataset.confirming = '1';
                        deleteBtn.style.background = '#D3968C';
                        deleteBtn.title = 'Click again to confirm delete';
                        deleteBtn.innerHTML = '<iconify-icon icon="ph:trash-duotone" class="text-lg"></iconify-icon>';
                        setTimeout(() => {
                            if (deleteBtn.dataset.confirming) {
                                delete deleteBtn.dataset.confirming;
                                deleteBtn.style.background = '';
                                deleteBtn.title = 'Delete room';
                                deleteBtn.innerHTML = '<iconify-icon icon="ph:x-bold" class="text-lg"></iconify-icon>';
                            }
                        }, 3000);
                    }
                });
            });

                grid.appendChild(cards);
                grid.setAttribute('aria-busy', 'false');

                if (!visibleRooms.length) {
                    grid.innerHTML = `<p class="text-[#F7F4D5]/40 text-center col-span-3 py-12">No ${activeFilter} projects yet.</p>`;
                }
            }

            renderFilters();
            renderProjects();
        } catch {
            projectCount.textContent = 'Projects unavailable';
            grid.innerHTML = '<p class="text-[#D3968C]/60 text-center col-span-3 py-12">Could not load projects — is the server running?</p>';
            grid.setAttribute('aria-busy', 'false');
        }
    }

    if (logoutBtn) {
        logoutBtn.addEventListener('click', async function() {
            await signOut(auth);
            window.location.href = 'index.html';
        });
    }
</script>
</body>
</html>
