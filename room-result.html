<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      try {
        if (localStorage.getItem('blueprintTheme') === 'dark') {
          document.documentElement.classList.add('dark-mode');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BluPrint | Room Planner</title>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./design-system.css">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
    }
    body {
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;
    }
    #root { min-height: 100vh; }
  </style>
</head>
<body class="page-result">
  <script>
    if (document.documentElement.classList.contains('dark-mode')) {
      document.body.classList.add('dark-mode');
    }
  </script>
  <div id="root"></div>
<script src="./theme-toggle.js" defer></script>
<script type="module" src="./src/main.tsx"></script>
</body>
</html>
