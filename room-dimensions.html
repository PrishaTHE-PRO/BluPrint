<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architecture Editor | BluPrint</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --garden-dark: #0A3323;
      --garden-moss: #839958;
      --garden-beige: #F7F4D5;
      --garden-rosy: #D3968C;
      --garden-midnight: #105666;
      --garden-accent: #f5a7b8;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background-color: var(--garden-dark);
      color: var(--garden-beige);
      overflow: hidden;
      height: 100vh;
    }

    h1, h2, h3, h4 {
      font-family: 'Crimson Pro', serif;
    }

    .noise-texture {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .grid-background {
      background-image:
              linear-gradient(rgba(131, 153, 88, 0.07) 1.5px, transparent 1.5px),
              linear-gradient(90deg, rgba(131, 153, 88, 0.07) 1.5px, transparent 1.5px);
      background-size: 50px 50px;
    }

    .ghibli-border {
      border: 2px solid rgba(247, 244, 213, 0.15);
      border-radius: 40px 60px 45px 70px / 65px 45px 75px 45px;
    }

    .garden-card {
      background: rgba(16, 86, 102, 0.2);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(247, 244, 213, 0.05);
    }

    .canvas-area {
      background: rgba(10, 51, 35, 0.4);
      border: 2px dashed rgba(247, 244, 213, 0.1);
      border-radius: 3rem;
      cursor: crosshair;
    }

    .toolbar-btn {
      width: 52px;
      height: 52px;
      background: rgba(247, 244, 213, 0.05);
      border: 1px solid rgba(247, 244, 213, 0.1);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      cursor: grab;
    }

    .toolbar-btn:active { cursor: grabbing; transform: scale(0.95); }
    .toolbar-btn:hover:not(:disabled) {
      background: var(--garden-rosy);
      color: white;
      border-color: var(--garden-rosy);
      box-shadow: 0 10px 20px -5px rgba(211, 150, 140, 0.4);
    }

    .dimension-input {
      background: rgba(10, 51, 35, 0.4);
      border: 2px solid rgba(247, 244, 213, 0.1);
      border-radius: 12px;
      padding: 10px 14px;
      color: var(--garden-beige);
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.3s ease;
      width: 100%;
    }
    .dimension-input:focus {
      outline: none;
      border-color: var(--garden-rosy);
      background: rgba(10, 51, 35, 0.6);
    }

    .room-path {
      fill: rgba(211, 150, 140, 0.05);
      stroke: var(--garden-rosy);
      stroke-width: 3.5;
      transition: d 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), stroke 0.3s ease;
    }

    .edge-highlight {
      stroke: #4ADE80;
      stroke-width: 6;
      stroke-linecap: round;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .edge-highlight.active { opacity: 1; }

    #custom-toast {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: var(--garden-midnight); border: 1px solid var(--garden-rosy);
      color: white; padding: 12px 24px; border-radius: 999px; font-weight: 600;
      z-index: 200; transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      display: flex; align-items: center; gap: 10px;
    }
    #custom-toast.visible { transform: translateX(-50%) translateY(0); }

    .vertex-handle { cursor: crosshair; transition: r 0.2s ease; pointer-events: all; }
    .cutout-preview { pointer-events: all; cursor: pointer; }
    .cutout-group:hover .vertex-handle { opacity: 1 !important; }
    .vertex-handle:hover { r: 8 !important; }

    @keyframes slideInRight { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
    .animate-slide-right { animation: slideInRight 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards; opacity: 0; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(247, 244, 213, 0.1); border-radius: 10px; }
  </style>
</head>
<body>
<div class="noise-texture"></div>
<div id="custom-toast"><iconify-icon icon="ph:info-duotone" class="text-xl"></iconify-icon> <span id="toast-msg">Element added</span></div>

<div class="min-h-screen relative flex flex-col grid-background">
  <!-- Nav Bar -->
  <nav id="main-nav" class="sticky top-0 z-50 px-8 py-3 flex items-center justify-between border-b border-[#F7F4D5]/10 shadow-md" style="background-color: var(--garden-accent);">
    <div class="flex items-center gap-4">
      <a href="#" id="nav-brand-link" class="flex items-center gap-4">
        <div class="w-10 h-10 bg-[#0A3323] rounded-[1rem] flex items-center justify-center shadow-inner transform transition hover:rotate-12 cursor-pointer">
          <iconify-icon icon="ph:sparkle-duotone" class="text-2xl text-[#F7F4D5]"></iconify-icon>
        </div>
        <span class="text-2xl font-bold tracking-tighter text-[#0A3323]" style="font-family:'Crimson Pro',serif">BluPrint</span>
      </a>
    </div>
    <div class="hidden md:flex items-center gap-10 text-[#0A3323]">
      <a href="#" id="nav-home-link" class="group relative font-bold text-base hover:text-[#0A3323]/80 transition-all">Home<span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-[#0A3323] transition-all group-hover:w-full"></span></a>
      <a href="#" id="nav-discover-link" class="group relative font-bold text-base hover:text-[#0A3323]/80 transition-all">Discover<span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-[#0A3323] transition-all group-hover:w-full"></span></a>
      <div class="w-10 h-10 rounded-full bg-[#0A3323]/10 flex items-center justify-center cursor-pointer border border-[#0A3323]/20">
        <iconify-icon icon="ph:user-duotone" class="text-xl text-[#0A3323]"></iconify-icon>
      </div>
    </div>
  </nav>

  <main class="flex-1 flex overflow-hidden p-6 gap-6 max-w-[1600px] mx-auto w-full">
    <!-- Left: SVG Canvas -->
    <section class="w-[70%] relative flex flex-col gap-4">
      <header class="animate-slide-right opacity-0" style="animation-delay: 0.1s">
        <h1 class="text-4xl font-bold text-[#F7F4D5]">Architectural Studio</h1>
        <p class="text-md text-[#F7F4D5]/60">Customize your footprint. Drag elements to walls, or vertices to reshape.</p>
      </header>

      <div id="canvas-container" class="flex-1 canvas-area relative flex items-center justify-center overflow-hidden garden-card ghibli-border">
        <svg id="editor-svg" viewBox="0 0 800 600" class="w-full h-full p-8 select-none">
          <defs>
            <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
              <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(247,244,213,0.03)" stroke-width="1"></path>
            </pattern>
            <pattern id="largeGrid" width="100" height="100" patternUnits="userSpaceOnUse">
              <rect width="100" height="100" fill="url(#smallGrid)"></rect>
              <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(247,244,213,0.08)" stroke-width="1.5"></path>
            </pattern>
            <symbol id="door-template">
              <path d="M 0 0 L 40 0" stroke="#F7F4D5" stroke-width="4" />
              <path d="M 40 0 A 40 40 0 0 1 0 40" stroke="#F7F4D5" stroke-width="1.5" stroke-dasharray="4 4" fill="none" />
              <path d="M 0 0 L 0 40" stroke="var(--garden-rosy)" stroke-width="4" />
            </symbol>
            <symbol id="window-template">
              <rect x="0" y="-3" width="40" height="6" fill="var(--garden-dark)" stroke="#F7F4D5" stroke-width="1.5" />
              <line x1="5" y1="-1" x2="35" y2="-1" stroke="#F7F4D5" stroke-width="1" />
              <line x1="5" y1="1" x2="35" y2="1" stroke="#F7F4D5" stroke-width="1" />
            </symbol>
          </defs>

          <rect width="100%" height="100%" fill="url(#largeGrid)"></rect>
          <path id="room-polygon" class="room-path" />
          <g id="edge-highlights"></g>
          <g id="placed-elements"></g>
          <g id="ghost-element" class="hidden"></g>

          <!-- Dynamic Labels -->
          <text id="label-width" x="400" y="135" text-anchor="middle" fill="var(--garden-rosy)" class="font-bold text-[10px] uppercase tracking-widest">15.0 ft</text>
          <text id="label-length" x="185" y="300" text-anchor="middle" transform="rotate(-90, 185, 300)" fill="var(--garden-rosy)" class="font-bold text-[10px] uppercase tracking-widest">12.0 ft</text>
        </svg>

        <div class="absolute bottom-8 right-8">
          <div id="area-badge" class="px-4 py-2 rounded-full bg-white/5 border border-white/10 backdrop-blur-md text-xs font-bold text-white/60 uppercase tracking-widest">
            Total Area: 180 SQ FT
          </div>
        </div>
      </div>
    </section>

    <!-- Right: Panel -->
    <section class="w-[30%] animate-slide-right opacity-0 flex flex-col gap-6" style="animation-delay: 0.3s">
      <div class="garden-card ghibli-border p-6 pb-32 h-full flex flex-col gap-6 overflow-y-auto">
        <!-- Section: Tools & History -->
        <div class="space-y-4">
          <h2 class="text-xl font-bold flex items-center gap-2">
            <iconify-icon icon="ph:pencil-circle-duotone" class="text-2xl text-rosy"></iconify-icon> Customize your room
          </h2>

          <div class="space-y-3">
            <div class="flex justify-between items-center bg-white/5 p-3 rounded-2xl">
              <span class="text-[10px] font-bold uppercase tracking-widest text-[#F7F4D5]/30 ml-1">History</span>
              <div class="flex gap-2">
                <button id="btn-undo" class="toolbar-btn !w-9 !h-9 text-[#F7F4D5]/60 hover:text-white disabled:opacity-20" disabled>
                  <iconify-icon icon="ph:arrow-u-up-left-duotone" class="text-lg"></iconify-icon>
                </button>
                <button id="btn-redo" class="toolbar-btn !w-9 !h-9 text-[#F7F4D5]/60 hover:text-white disabled:opacity-20" disabled>
                  <iconify-icon icon="ph:arrow-u-up-right-duotone" class="text-lg"></iconify-icon>
                </button>
              </div>
            </div>
            <div class="grid grid-cols-1 gap-2.5">
              <div class="flex items-center gap-3 bg-white/5 p-2 rounded-2xl hover:bg-white/10 transition-colors cursor-pointer group">
                <div draggable="true" data-type="door" class="toolbar-btn !w-10 !h-10">
                  <iconify-icon icon="ph:door-duotone" class="text-xl"></iconify-icon>
                </div>
                <span class="text-[11px] font-bold text-[#F7F4D5]/60 uppercase tracking-widest">Door</span>
              </div>
              <div class="flex items-center gap-3 bg-white/5 p-2 rounded-2xl hover:bg-white/10 transition-colors cursor-pointer group">
                <div draggable="true" data-type="window" class="toolbar-btn !w-10 !h-10">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="12" y1="7" x2="12" y2="17"></line>
                    <line x1="7" y1="12" x2="17" y2="12"></line>
                  </svg>
                </div>
                <span class="text-[11px] font-bold text-[#F7F4D5]/60 uppercase tracking-widest">Window</span>
              </div>
              <div class="flex items-center gap-3 bg-white/5 p-2 rounded-2xl hover:bg-white/10 transition-colors cursor-pointer group">
                <div draggable="true" data-type="cutout" class="toolbar-btn !w-10 !h-10 border-dashed">
                  <iconify-icon icon="ph:square-duotone" class="text-xl"></iconify-icon>
                </div>
                <span class="text-[11px] font-bold text-[#F7F4D5]/60 uppercase tracking-widest">Cutout</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Section: Room Dimensions -->
        <div class="space-y-6 pt-4 border-t border-[#F7F4D5]/10">
          <h2 class="text-xl font-bold flex items-center gap-2">
            <iconify-icon icon="ph:ruler-duotone" class="text-2xl text-rosy"></iconify-icon> Room Parameters
          </h2>

          <div class="space-y-4">
            <div class="space-y-2">
              <label class="text-[10px] font-bold uppercase tracking-widest text-[#F7F4D5]/40">Space Name</label>
              <input type="text" id="room-name" value="Primary Suite" class="dimension-input">
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div class="space-y-2">
                <label class="text-[10px] font-bold uppercase tracking-widest text-[#F7F4D5]/40">Width</label>
                <div class="relative">
                  <input type="number" id="room-width" value="15" step="0.1" class="dimension-input">
                  <span class="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] font-bold text-[#F7F4D5]/30 unit-label">ft</span>
                </div>
              </div>
              <div class="space-y-2">
                <label class="text-[10px] font-bold uppercase tracking-widest text-[#F7F4D5]/40">Length</label>
                <div class="relative">
                  <input type="number" id="room-length" value="12" step="0.1" class="dimension-input">
                  <span class="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] font-bold text-[#F7F4D5]/30 unit-label">ft</span>
                </div>
              </div>
            </div>

            <div class="space-y-2">
              <label class="text-[10px] font-bold uppercase tracking-widest text-[#F7F4D5]/40">Ceiling Height</label>
              <div class="relative">
                <input type="number" id="room-height" value="9.5" step="0.1" class="dimension-input">
                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] font-bold text-[#F7F4D5]/30 unit-label">ft</span>
              </div>
            </div>

            <div class="space-y-3">
              <label class="text-[10px] font-bold uppercase tracking-widest text-[#F7F4D5]/40">Measurement Unit</label>
              <div class="flex gap-4 p-1.5 rounded-2xl bg-[#0A3323]/40 border border-white/5">
                <button id="unit-ft" class="flex-1 py-5 rounded-2xl text-sm font-bold transition-all bg-[#D3968C] text-white shadow-lg">Feet (ft)</button>
                <button id="unit-m" class="flex-1 py-5 rounded-2xl text-sm font-bold transition-all text-[#F7F4D5]/40 hover:text-[#F7F4D5]">Meters (m)</button>
              </div>
            </div>
          </div>

          <button id="save-changes" class="w-full py-4 bg-rosy/10 border border-rosy/30 text-rosy rounded-2xl font-bold hover:bg-rosy hover:text-white transition-all transform hover:scale-[1.02] flex items-center justify-center gap-2">
            Apply Changes <iconify-icon icon="ph:check-bold"></iconify-icon>
          </button>
        </div>

        <!-- Helper Info -->
        <div class="mt-auto p-4 rounded-xl bg-[#D3968C]/5 border border-[#D3968C]/10 space-y-2">
          <div class="flex items-center gap-2 text-[#D3968C] text-xs font-bold">
            <iconify-icon icon="ph:command-bold"></iconify-icon>
            <span>Shortcuts</span>
          </div>
          <p class="text-[#F7F4D5]/40 text-[10px] leading-relaxed">
            <kbd class="px-1 py-0.5 bg-black/20 rounded">Ctrl+Z</kbd> Undo &nbsp;
            <kbd class="px-1 py-0.5 bg-black/20 rounded">Ctrl+Y</kbd> Redo &nbsp;
            <kbd class="px-1 py-0.5 bg-black/20 rounded">Del</kbd> Remove
          </p>
        </div>
      </div>
    </section>
  </main>
  <button id="cta-save-continue" class="fixed bottom-8 right-8 z-50 flex items-center gap-3 bg-[#D3968C] text-white px-8 py-4 rounded-2xl font-bold shadow-2xl hover:scale-110 hover:bg-[#c1867b] transition-all transform active:scale-95">
    Save & Continue <iconify-icon icon="ph:arrow-right-bold" class="text-xl"></iconify-icon>
  </button>
</div>

<script>
  const svg = document.getElementById('editor-svg');
  const roomPath = document.getElementById('room-polygon');
  const placedGroup = document.getElementById('placed-elements');
  const highlightsGroup = document.getElementById('edge-highlights');
  const ghost = document.getElementById('ghost-element');
  const toast = document.getElementById('custom-toast');
  const toastMsg = document.getElementById('toast-msg');
  const btnUndo = document.getElementById('btn-undo');
  const btnRedo = document.getElementById('btn-redo');
  let hoveredItem = null;
  let selectedItem = null;

  // Dimension Controls
  const widthInput = document.getElementById('room-width');
  const lengthInput = document.getElementById('room-length');
  const areaBadge = document.getElementById('area-badge');
  const labelWidth = document.getElementById('label-width');
  const labelLength = document.getElementById('label-length');
  const unitFt = document.getElementById('unit-ft');
  const unitM = document.getElementById('unit-m');

  let currentUnit = 'ft';

  let state = {
    roomPoints: [
      {x: 200, y: 150}, {x: 600, y: 150},
      {x: 600, y: 450}, {x: 200, y: 450}
    ],
    elements: [],
    cutouts: []
  };

  let history = [];
  let historyIndex = -1;
  let draggingFromToolbar = null;
  let debounceTimer = null;

  function cloneObj(obj) { return JSON.parse(JSON.stringify(obj)); }

  function saveState() {
    if (historyIndex < history.length - 1) {
      history = history.slice(0, historyIndex + 1);
    }
    history.push(cloneObj(state));
    historyIndex++;
    updateHistoryUI();
  }

  function updateHistoryUI() {
    btnUndo.disabled = historyIndex <= 0;
    btnRedo.disabled = historyIndex >= history.length - 1;
  }

  function undo() {
    if (historyIndex > 0) {
      historyIndex--;
      state = cloneObj(history[historyIndex]);
      renderAll();
      updateHistoryUI();
      showToast("Action undone");
    }
  }

  function redo() {
    if (historyIndex < history.length - 1) {
      historyIndex++;
      state = cloneObj(history[historyIndex]);
      renderAll();
      updateHistoryUI();
      showToast("Action redone");
    }
  }

  function showToast(msg) {
    toastMsg.innerText = msg;
    toast.classList.add('visible');
    setTimeout(() => toast.classList.remove('visible'), 2000);
  }

  function getClosestPointOnPerimeter(x, y) {
    let minDist = Infinity;
    let closest = null;
    let edgeIndex = -1;

    for (let i = 0; i < state.roomPoints.length; i++) {
      const p1 = state.roomPoints[i];
      const p2 = state.roomPoints[(i + 1) % state.roomPoints.length];
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const lenSq = dx * dx + dy * dy;
      let t = ((x - p1.x) * dx + (y - p1.y) * dy) / lenSq;
      t = Math.max(0, Math.min(1, t));
      const px = p1.x + t * dx;
      const py = p1.y + t * dy;
      const dist = Math.sqrt((x - px) ** 2 + (y - py) ** 2);
      if (dist < minDist) {
        minDist = dist;
        closest = { x: px, y: py, angle: Math.atan2(dy, dx) * 180 / Math.PI };
        edgeIndex = i;
      }
    }
    return { point: closest, dist: minDist, edgeIndex };
  }

  function renderAll() {
    renderRoom();
    renderElements();
    renderCutouts();
    updateDimensionsFromState();
  }

  function renderRoom() {
    let d = state.roomPoints.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ') + ' Z';
    state.cutouts.forEach(c => {
      const p = c.points;
      d += ` M ${p[0].x} ${p[0].y} L ${p[1].x} ${p[1].y} L ${p[2].x} ${p[2].y} L ${p[3].x} ${p[3].y} Z`;
    });
    roomPath.setAttribute('d', d);
    roomPath.setAttribute('fill-rule', 'evenodd');

    highlightsGroup.innerHTML = '';
    state.roomPoints.forEach((p, i) => {
      const p2 = state.roomPoints[(i + 1) % state.roomPoints.length];
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute('x1', p.x); line.setAttribute('y1', p.y);
      line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
      line.classList.add('edge-highlight');
      line.id = `edge-${i}`;
      highlightsGroup.appendChild(line);
    });
  }

  function renderCutouts() {
    Array.from(placedGroup.querySelectorAll('.cutout-group')).forEach(h => h.remove());
    state.cutouts.forEach((c) => {
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.classList.add('cutout-group');
      g.onmouseenter = () => hoveredItem = {type: 'cutout', id: c.id};
      g.onmouseleave = () => hoveredItem = null;
      const outline = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const d = `M ${c.points[0].x} ${c.points[0].y} L ${c.points[1].x} ${c.points[1].y} L ${c.points[2].x} ${c.points[2].y} L ${c.points[3].x} ${c.points[3].y} Z`;
      outline.setAttribute('d', d);
      outline.setAttribute('fill', 'rgba(211, 150, 140, 0.1)');
      outline.setAttribute('stroke', 'var(--garden-rosy)');
      outline.setAttribute('stroke-dasharray', '4 4');
      outline.setAttribute('class', 'cutout-preview');
      g.appendChild(outline);
      c.points.forEach((p, pIdx) => {
        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute('cx', p.x); circle.setAttribute('cy', p.y); circle.setAttribute('r', '5');
        circle.setAttribute('fill', 'var(--garden-rosy)'); circle.setAttribute('stroke', 'white');
        circle.setAttribute('class', 'vertex-handle opacity-0');
        circle.onmousedown = (e) => {
          e.stopPropagation();
          const onMove = (mv) => {
            const mpt = svg.createSVGPoint(); mpt.x = mv.clientX; mpt.y = mv.clientY;
            const msvgP = mpt.matrixTransform(svg.getScreenCTM().inverse());
            const snap = getClosestPointOnPerimeter(msvgP.x, msvgP.y);
            if (snap.dist < 15) { c.points[pIdx].x = snap.point.x; c.points[pIdx].y = snap.point.y; }
            else { c.points[pIdx].x = msvgP.x; c.points[pIdx].y = msvgP.y; }
            renderRoom(); renderCutouts();
          };
          const onUp = () => {
            window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp);
            saveState(); renderAll();
          };
          window.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onUp);
        };
        g.appendChild(circle);
      });
      placedGroup.appendChild(g);
    });
  }

  function renderElements() {
    placedGroup.innerHTML = '';
    state.elements.forEach((el) => {
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      const colors = { door: '#ef4444', window: '#3b82f6', cutout: '#facc15' };
      g.innerHTML = `<use href="#${el.type}-template" transform="translate(${el.x},${el.y}) rotate(${el.angle}) translate(-20, 0)" style="stroke: ${colors[el.type] || 'var(--garden-rosy)'}" />`;
      g.classList.add('cursor-move');
      g.setAttribute('pointer-events', 'all');
      g.onmouseenter = () => hoveredItem = {type: 'element', id: el.id};
      g.onmouseleave = () => hoveredItem = null;
      placedGroup.appendChild(g);
    });
  }

  function updateDimensionsFromState() {
    const p1 = state.roomPoints[0];
    const p2 = state.roomPoints[1];
    const p3 = state.roomPoints[2];

    const width = Math.sqrt((p2.x-p1.x)**2 + (p2.y-p1.y)**2) / 20; // scale 1ft = 20px
    const length = Math.sqrt((p3.x-p2.x)**2 + (p3.y-p2.y)**2) / 20;

    widthInput.value = width.toFixed(1);
    lengthInput.value = length.toFixed(1);
    areaBadge.innerText = `Total Area: ${(width * length).toFixed(1)} SQ ${currentUnit === 'ft' ? 'FT' : 'M'}`;

    labelWidth.innerText = `${width.toFixed(1)} ${currentUnit}`;
    labelLength.innerText = `${length.toFixed(1)} ${currentUnit}`;
  }

  function applyDimensionChanges() {
    const w = parseFloat(widthInput.value) * 20;
    const l = parseFloat(lengthInput.value) * 20;
    const centerX = 400, centerY = 300;
    state.roomPoints = [
      { x: centerX - w/2, y: centerY - l/2 },
      { x: centerX + w/2, y: centerY - l/2 },
      { x: centerX + w/2, y: centerY + l/2 },
      { x: centerX - w/2, y: centerY + l/2 }
    ];

    history = [cloneObj(state)];
    historyIndex = 0;
    updateHistoryUI();
    renderAll();
    showToast("Checkpoint created: Changes saved");
  }

  // Interactions
  document.querySelectorAll('.toolbar-btn[draggable="true"]').forEach(btn => {
    btn.addEventListener('dragstart', (e) => {
      draggingFromToolbar = btn.dataset.type;
      e.dataTransfer.setData('text/plain', draggingFromToolbar);
    });
  });

  svg.addEventListener('dragover', (e) => {
    e.preventDefault();
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
    const snap = getClosestPointOnPerimeter(svgP.x, svgP.y);

    if (snap.dist < 60) {
      document.querySelectorAll('.edge-highlight').forEach(el => el.classList.remove('active'));
      document.getElementById(`edge-${snap.edgeIndex}`).classList.add('active');
      ghost.classList.remove('hidden');
      ghost.innerHTML = `<use href="#${draggingFromToolbar}-template" transform="translate(${snap.point.x},${snap.point.y}) rotate(${snap.point.angle}) translate(-20, 0)" />`;
    } else {
      ghost.classList.add('hidden');
      document.querySelectorAll('.edge-highlight').forEach(el => el.classList.remove('active'));
    }
  });

  svg.addEventListener('drop', (e) => {
    e.preventDefault();
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
    const snap = getClosestPointOnPerimeter(svgP.x, svgP.y);

    if (snap.dist < 80) {
      if (draggingFromToolbar === 'cutout') {
        const p = snap.point; const size = 40;
        state.cutouts.push({
          id: Date.now(),
          type: 'cutout',
          points: [
            {x: p.x - size, y: p.y - size}, {x: p.x + size, y: p.y - size},
            {x: p.x + size, y: p.y + size}, {x: p.x - size, y: p.y + size}
          ]
        });
      } else {
        state.elements.push({
          id: Date.now(),
          type: draggingFromToolbar,
          x: snap.point.x, y: snap.point.y, angle: snap.point.angle
        });
      }
      saveState(); renderAll();
    }
    ghost.classList.add('hidden');
    document.querySelectorAll('.edge-highlight').forEach(el => el.classList.remove('active'));
  });

  unitFt.onclick = () => {
    currentUnit = 'ft';
    unitFt.classList.add('bg-[#D3968C]', 'text-white', 'shadow-lg');
    unitFt.classList.remove('text-[#F7F4D5]/40');
    unitM.classList.remove('bg-[#D3968C]', 'text-white', 'shadow-lg');
    unitM.classList.add('text-[#F7F4D5]/40');
    document.querySelectorAll('.unit-label').forEach(l => l.innerText = 'ft');
    updateDimensionsFromState();
  };

  unitM.onclick = () => {
    currentUnit = 'm';
    unitM.classList.add('bg-[#D3968C]', 'text-white', 'shadow-lg');
    unitM.classList.remove('text-[#F7F4D5]/40');
    unitFt.classList.remove('bg-[#D3968C]', 'text-white', 'shadow-lg');
    unitFt.classList.add('text-[#F7F4D5]/40');
    document.querySelectorAll('.unit-label').forEach(l => l.innerText = 'm');
    updateDimensionsFromState();
  };

  function updateRoomFromInputs() {
    const wVal = parseFloat(widthInput.value);
    const lVal = parseFloat(lengthInput.value);

    if (isNaN(wVal) || isNaN(lVal) || wVal <= 0 || lVal <= 0) return;

    const w = wVal * 20;
    const l = lVal * 20;
    const centerX = 400, centerY = 300;

    state.roomPoints = [
      { x: centerX - w/2, y: centerY - l/2 },
      { x: centerX + w/2, y: centerY - l/2 },
      { x: centerX + w/2, y: centerY + l/2 },
      { x: centerX - w/2, y: centerY + l/2 }
    ];

    // Immediate visual feedback
    renderRoom();
    updateDimensionsFromState();

    // Clear existing elements on resize as per spec
    state.elements = [];
    state.cutouts = [];
    renderElements();
    renderCutouts();

    // Debounced history save
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      saveState();
    }, 500);
  }

  widthInput.addEventListener('input', updateRoomFromInputs);
  lengthInput.addEventListener('input', updateRoomFromInputs);

  document.getElementById('save-changes').onclick = applyDimensionChanges;
  document.getElementById('cta-save-continue').onclick = async () => {
    const userId = localStorage.getItem('blueprintUserId');
    if (!userId) { showToast("Not logged in — please sign in first"); return; }

    const name    = document.getElementById('room-name').value.trim() || 'My Room';
    const widthFt = parseFloat(widthInput.value);
    const lengthFt = parseFloat(lengthInput.value);
    const heightFt = parseFloat(document.getElementById('room-height').value);

    const btn = document.getElementById('cta-save-continue');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    try {
      const res = await fetch('/api/rooms', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, name, widthFt, lengthFt, heightFt }),
      });
      if (!res.ok) throw new Error('Save failed');
      const room = await res.json();
      localStorage.setItem('blueprintCurrentRoomId', room._id);
      showToast("Room saved! Redirecting...");
      setTimeout(() => { window.location.href = 'inspo-upload.html'; }, 800);
    } catch (e) {
      showToast("Could not save room — is the server running?");
      btn.disabled = false;
      btn.innerHTML = 'Save & Continue <iconify-icon icon="ph:arrow-right-bold" class="text-xl"></iconify-icon>';
    }
  };
  btnUndo.onclick = undo;
  btnRedo.onclick = redo;

  window.onkeydown = (e) => {
    if (e.key === 'z' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); undo(); }
    if (e.key === 'y' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); redo(); }
    if (e.key === 'Backspace' || e.key === 'Delete') {
      const target = hoveredItem || selectedItem;
      if (target) {
        if (target.type === 'element') {
          state.elements = state.elements.filter(el => el.id !== target.id);
        } else if (target.type === 'cutout') {
          state.cutouts = state.cutouts.filter(c => c.id !== target.id);
        }
        hoveredItem = null; selectedItem = null;
        saveState(); renderAll();
        showToast("Element removed");
      }
    }
  };

  // Init
  saveState();
  renderAll();
</script>
</body>
</html>
