<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<style>
body{margin:0;background:#dce7ef;color:#14202e;font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#294f7d;text-decoration:none}a:hover{color:#1f4069}
button,input{font:inherit;color:inherit}
@keyframes bpUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes bpMarquee{to{transform:translateX(-50%)}}
</style>
</helmet>
<div style="position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 92% 8%, rgba(110,165,205,.46), transparent 34rem), radial-gradient(circle at 5% 88%, rgba(145,181,210,.38), transparent 30rem), linear-gradient(135deg,#eeeae5 0%,#dce7ef 48%,#c8ddeb 100%)"></div>
<div style="position:fixed;inset:0;z-index:0;pointer-events:none;background:#fff;opacity:.3;mask:url(assets/blueprint.png) center/cover no-repeat;mask-mode:luminance"></div>
<div style="position:fixed;inset:0;z-index:0;pointer-events:none;-webkit-mask-image:radial-gradient(circle 180px at var(--mx,-999px) var(--my,-999px),#000 0%,transparent 100%);mask-image:radial-gradient(circle 180px at var(--mx,-999px) var(--my,-999px),#000 0%,transparent 100%)"><div style="position:absolute;inset:0;background:#fff;opacity:.95;mask:url(assets/blueprint.png) center/cover no-repeat;mask-mode:luminance"></div></div>

<div style="position:relative;z-index:1;min-height:100vh;display:flex;flex-wrap:wrap;align-items:stretch;gap:24px;padding:24px;box-sizing:border-box">
  <section style="flex:1.1 1 460px;position:relative;overflow:hidden;border-radius:32px;padding:40px;display:flex;flex-direction:column;justify-content:space-between;gap:40px;min-height:560px;background:#163a63;color:#eef3f7;box-shadow:0 30px 70px rgba(20,32,46,.25);animation:bpUp .7s cubic-bezier(.2,.8,.2,1) both">
    <div style="position:absolute;inset:0;background:#fff;opacity:.16;mask:url(assets/blueprint.png) center/cover no-repeat;mask-mode:luminance;pointer-events:none"></div>
    <div style="position:relative;display:flex;align-items:baseline;gap:3px"><span style="font-family:'Instrument Serif',serif;font-style:italic;font-size:34px;line-height:1;color:#8fc5e7">Blu</span><span style="font-size:13px;font-weight:600;letter-spacing:.18em">PRINT</span></div>
    <div style="position:relative">
      <h1 style="margin:0 0 18px;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(46px,5.5vw,76px);line-height:.98;letter-spacing:-.01em;max-width:560px">Design the room <span style="font-style:italic;color:#8fc5e7">you already have.</span></h1>
      <p style="margin:0;font-size:16px;line-height:1.55;color:rgba(238,243,247,.75);max-width:440px;text-wrap:pretty">Define your space, share what you love, and get furniture you can actually buy, laid out on your own floor plan.</p>
    </div>
    <div style="position:relative;display:flex;flex-direction:column;gap:18px">
      <div style="overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)">
        <div style="display:flex;gap:8px;width:max-content;animation:bpMarquee 30s linear infinite">
          <sc-for list="{{ marquee }}" as="m" hint-placeholder-count="16"><span style="display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);font-size:13px;white-space:nowrap"><iconify-icon icon="{{ m.icon }}" style="color:#8fc5e7"></iconify-icon>{{ m.label }}</span></sc-for>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
        <div style="padding:14px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)"><span style="font-family:'Geist Mono',monospace;font-size:11px;color:#8fc5e7">01</span><div style="font-size:14px;margin-top:6px">Define your room</div></div>
        <div style="padding:14px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)"><span style="font-family:'Geist Mono',monospace;font-size:11px;color:#8fc5e7">02</span><div style="font-size:14px;margin-top:6px">Share your taste</div></div>
        <div style="padding:14px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)"><span style="font-family:'Geist Mono',monospace;font-size:11px;color:#8fc5e7">03</span><div style="font-size:14px;margin-top:6px">Shop the plan</div></div>
      </div>
    </div>
  </section>

  <section style="flex:1 1 380px;display:grid;place-items:center;padding:24px 0">
    <div style="width:min(100%,400px);padding:36px;border-radius:32px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(24px);box-shadow:0 24px 60px rgba(41,79,125,.14);animation:bpUp .7s .1s cubic-bezier(.2,.8,.2,1) both">
      <div style="position:relative;display:flex;padding:4px;border-radius:999px;background:rgba(41,79,125,.07);margin-bottom:28px">
        <span style="position:absolute;top:4px;bottom:4px;left:{{ tabLeft }};width:calc(50% - 4px);border-radius:999px;background:#fff;box-shadow:0 2px 8px rgba(41,79,125,.14);transition:left .35s cubic-bezier(.2,.8,.2,1)"></span>
        <button onClick="{{ toIn }}" style="position:relative;flex:1;height:36px;border:0;background:transparent;font-size:14px;font-weight:500;cursor:pointer">Sign in</button>
        <button onClick="{{ toUp }}" style="position:relative;flex:1;height:36px;border:0;background:transparent;font-size:14px;font-weight:500;cursor:pointer">Create account</button>
      </div>
      <h2 style="margin:0 0 6px;font-family:'Instrument Serif',serif;font-weight:400;font-size:40px;line-height:1">{{ title }}</h2>
      <p style="margin:0 0 24px;font-size:14px;color:#5d6b7b">{{ sub }}</p>
      <div style="display:flex;flex-direction:column;gap:12px">
        <sc-if value="{{ isUp }}" hint-placeholder-val="{{ false }}">
          <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:12.5px;color:#5d6b7b">Name</span><input placeholder="Prisha" style="height:50px;padding:0 16px;border-radius:14px;border:1.5px solid transparent;background:rgba(41,79,125,.06);font-size:15px;outline:none" style-focus="border-color:#294f7d;background:#fff"></label>
        </sc-if>
        <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:12.5px;color:#5d6b7b">Email</span><input type="email" placeholder="you@example.com" style="height:50px;padding:0 16px;border-radius:14px;border:1.5px solid transparent;background:rgba(41,79,125,.06);font-size:15px;outline:none" style-focus="border-color:#294f7d;background:#fff"></label>
        <label style="display:flex;flex-direction:column;gap:6px"><span style="display:flex;justify-content:space-between;font-size:12.5px;color:#5d6b7b">Password<sc-if value="{{ isIn }}" hint-placeholder-val="{{ true }}"><a href="#" style="font-size:12.5px">Forgot?</a></sc-if></span><input type="password" placeholder="••••••••" style="height:50px;padding:0 16px;border-radius:14px;border:1.5px solid transparent;background:rgba(41,79,125,.06);font-size:15px;outline:none" style-focus="border-color:#294f7d;background:#fff"></label>
        <a href="Dashboard.dc.html" style="margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:16px;background:#294f7d;color:#fff;font-size:15px;font-weight:500;box-shadow:0 12px 28px rgba(41,79,125,.3);transition:transform .2s" style-hover="transform:translateY(-2px);color:#fff;background:#1f4069">{{ cta }}<iconify-icon icon="ph:arrow-right"></iconify-icon></a>
      </div>
      <div style="display:flex;align-items:center;gap:12px;margin:22px 0;font-size:12px;color:#8a97a6"><span style="flex:1;height:1px;background:rgba(20,32,46,.1)"></span>or<span style="flex:1;height:1px;background:rgba(20,32,46,.1)"></span></div>
      <button style="width:100%;height:50px;border-radius:16px;border:1px solid rgba(20,32,46,.12);background:#fff;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px" style-hover="background:#f4f7fa"><iconify-icon icon="logos:google-icon" style="font-size:18px"></iconify-icon>Continue with Google</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const TYPES = [['Bedroom', 'ph:bed'], ['Living room', 'ph:couch'], ['Kitchen', 'ph:cooking-pot'], ['Bathroom', 'ph:bathtub'], ['Home office', 'ph:desk'], ['Dining room', 'ph:fork-knife'], ['Nursery', 'ph:baby'], ['Studio', 'ph:house-line']];
class Component extends DCLogic {
  state = { mode: 'in' };
  componentDidMount() { this._mv = (e) => { const r = document.documentElement.style; r.setProperty('--mx', e.clientX + 'px'); r.setProperty('--my', e.clientY + 'px'); }; window.addEventListener('pointermove', this._mv); }
  componentWillUnmount() { window.removeEventListener('pointermove', this._mv); }
  renderVals() {
    const up = this.state.mode === 'up';
    return {
      marquee: [...TYPES, ...TYPES].map(([label, icon]) => ({ label, icon })),
      tabLeft: up ? '50%' : '4px', isUp: up, isIn: !up,
      toIn: () => this.setState({ mode: 'in' }), toUp: () => this.setState({ mode: 'up' }),
      title: up ? 'Make it yours' : 'Welcome back', sub: up ? 'Create an account to save your rooms.' : 'Sign in to pick up where you left off.',
      cta: up ? 'Create account' : 'Sign in',
    };
  }
}
</script>
</body>
</html>
